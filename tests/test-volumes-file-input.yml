name: Test volumes_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Create volumes file
        run: |
          cat > "$GITHUB_WORKSPACE/volumes.yaml" <<'EOF'
          my-volume:
            name: my-volume
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "fake-token-for-volumes-file-test"
          stack_id: "00000000-0000-0000-0000-000000000000"
          volumes_file: "volumes.yaml"
      - name: Assert action ran with volumes_file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid token/stack_id, but it must
          # have been invoked (not skipped). A 'skipped' outcome would mean
          # the input was rejected before the action ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — volumes_file input may not have been accepted"
            exit 1
          fi
          echo "PASS: action was invoked with volumes_file input (outcome=$OUTCOME)"
