name: Test nonexistent services_file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with a nonexistent services_file and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          api_token: 'some-api-token'
          stack_id: 'some-stack-id'
          services_file: '/nonexistent/path/to/services.yaml'
      - name: Assert action failed due to missing services file
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when services_file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when services_file does not exist"
