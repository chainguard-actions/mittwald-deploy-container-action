name: Test missing stack configuration fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without any stack config and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          api_token: 'some-api-token'
          stack_id: 'some-stack-id'
          # No stack_yaml, stack_file, services_yaml, or services_file provided
      - name: Assert action failed due to missing stack configuration
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no stack configuration is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no stack configuration is provided"
