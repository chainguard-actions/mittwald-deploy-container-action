name: Test services_file and volumes_file inputs (invalid token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create services file
        run: |
          cat > /tmp/services.yaml << 'EOF'
          my-service:
            image: nginx:latest
            ports:
              - "80:80"
          EOF

      - name: Create volumes file
        run: |
          cat > /tmp/volumes.yaml << 'EOF'
          my-volume:
            name: my-volume
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-token-for-testing
          stack_id: 00000000-0000-0000-0000-000000000000
          services_file: /tmp/services.yaml
          volumes_file: /tmp/volumes.yaml

      - name: Assert action failed due to invalid token (not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid token"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid token"
