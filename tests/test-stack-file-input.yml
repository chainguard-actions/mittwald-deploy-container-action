name: Test stack_file input parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-token-for-testing
          stack_id: 00000000-0000-0000-0000-000000000000
          stack_file: ${{ github.workspace }}/pristine/mittwald--deploy-container-action/v1.0.0/tests/fixtures/stack.yaml
      - name: Assert action failed due to invalid credentials (not file reading error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (stack_file input accepted, invalid credentials caused failure)"
