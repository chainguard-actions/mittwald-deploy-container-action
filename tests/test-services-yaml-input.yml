name: Test services_yaml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-token-for-testing
          stack_id: 00000000-0000-0000-0000-000000000000
          services_yaml: |
            web:
              image: nginx:latest
              ports:
                - "80:80"
      - name: Assert action failed due to invalid credentials (not input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (invalid credentials, not input parsing error)"
