name: Test missing stack_id fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          api_token: 'some-api-token'
          stack_id: ''
          services_yaml: |
            myservice:
              image: nginx:latest
      - name: Assert action failed due to missing stack_id
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when stack_id is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when stack_id is missing"
