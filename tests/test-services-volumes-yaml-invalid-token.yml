name: Test services_yaml and volumes_yaml inputs with invalid token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with services_yaml and volumes_yaml and invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "invalid-token-for-testing"
          stack_id: "00000000-0000-0000-0000-000000000000"
          services_yaml: |
            web:
              image: nginx:latest
              ports:
                - "80:80"
          volumes_yaml: |
            data:
              driver: local

      - name: Assert action failed (invalid token should cause failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API token, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API token"
